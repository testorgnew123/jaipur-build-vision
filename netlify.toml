[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# nodemailer uses dynamic requires the esbuild bundler cannot trace, so ship it as a
# real node_module inside the function bundle instead of inlining it.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["nodemailer"]

# Exact collection routes — must come before wildcards
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/posts"
  to = "/.netlify/functions/posts"
  status = 200

[[redirects]]
  from = "/api/visits"
  to = "/.netlify/functions/visits"
  status = 200

[[redirects]]
  from = "/api/users"
  to = "/.netlify/functions/users"
  status = 200

[[redirects]]
  from = "/api/jobs"
  to = "/.netlify/functions/jobs"
  status = 200

# Wildcard item routes
[[redirects]]
  from = "/api/posts/*"
  to = "/.netlify/functions/posts-slug"
  status = 200

[[redirects]]
  from = "/api/visits/*"
  to = "/.netlify/functions/visits-id"
  status = 200

[[redirects]]
  from = "/api/users/*"
  to = "/.netlify/functions/users-id"
  status = 200

[[redirects]]
  from = "/api/jobs/*"
  to = "/.netlify/functions/jobs-id"
  status = 200

# SPA fallback for production lives in public/_redirects so Netlify Dev
# does not intercept Vite module requests (which would break HMR).

# Security / best-practice response headers (applied to all routes).
# CSP is intentionally omitted here: the site loads Google Fonts, Unsplash
# images and third-party embeds, so a Content-Security-Policy needs per-source
# tuning before it can be enforced without breaking assets.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
